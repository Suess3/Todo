<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>
<body>
    <div id="auth-screen" class="hidden"></div>
    <div id="bg-pattern-overlay"></div>
    <div id="app" class="hidden">

        <div id="charts-modal" class="modal-overlay hidden">
            <div class="modal-card charts-card">
                <div class="modal-header">
                    <span>Productivity</span>
                    <button id="charts-close" class="modal-close">✕</button>
                </div>
                <div id="charts-loading" class="charts-loading hidden">Loading…</div>
                <div id="charts-content" class="charts-grid hidden">
                    <div class="chart-wrap"><canvas id="week-chart"></canvas></div>
                    <div class="chart-wrap"><canvas id="alltime-chart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <span>Settings</span>
                    <button id="settings-close" class="modal-close">✕</button>
                </div>
                <div class="setting-row">
                    <span>Light mode</span>
                    <label class="toggle">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
<div class="setting-row">
                    <span>App icon badge</span>
                    <label class="toggle">
                        <input type="checkbox" id="badge-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <span>Urgency coloring intensity</span>
                    <input type="range" id="urgency-slider" min="0" max="100" value="50" class="urgency-slider">
                </div>
                <div class="setting-row">
                    <span>Main color</span>
                    <input type="range" id="accent-slider" min="0" max="360" value="217" class="accent-slider">
                </div>
                <div class="setting-row">
                    <span>Background shade</span>
                    <input type="range" id="bg-slider" min="0" max="100" value="0" class="urgency-slider">
                </div>
                <div class="setting-row setting-col">
                    <span>Background pattern</span>
                    <div class="pattern-picker" id="pattern-picker">
                        <button class="pattern-btn active" data-pattern="none">None</button>
                        <button class="pattern-btn" data-pattern="grain">Grain</button>
                        <button class="pattern-btn" data-pattern="dots">Dots</button>
                        <button class="pattern-btn" data-pattern="grid">Grid</button>
                        <button class="pattern-btn" data-pattern="diagonal">Lines</button>
                        <button class="pattern-btn" data-pattern="scan">Scan</button>
                    </div>
                </div>
                <div class="setting-row" id="pattern-opacity-row">
                    <span>Pattern strength</span>
                    <input type="range" id="pattern-slider" min="0" max="100" value="30" class="urgency-slider">
                </div>
                <div class="setting-row">
                    <span>Background photo</span>
                    <div class="banner-btns">
                        <button id="banner-choose-btn" class="modal-action-btn">Choose photo</button>
                        <button id="banner-remove-btn" class="modal-action-btn muted">Remove</button>
                    </div>
                </div>
                <input type="file" id="banner-file-input" accept="image/*" style="display:none">
                <div class="setting-row">
                    <button id="signout-btn" class="signout-btn danger">Sign out</button>
                </div>
            </div>
        </div>

        <div id="app-banner">
            <div class="app-header">
                <span id="version-label" class="version-label"></span>
                <button id="charts-btn" class="settings-btn" title="Productivity">◑</button>
                <button id="settings-btn" class="settings-btn">⚙︎</button>
            </div>
            <div id="page-tabs" class="page-tabs hidden">
                <button class="page-tab active" data-page="todo">Todo</button>
                <button class="page-tab" data-page="keepInMind">Notes</button>
                <button class="page-tab" data-page="soon">Soon</button>
                <button class="page-tab" data-page="longRun">Long run</button>
            </div>
        </div>

        <div id="app-content" class="app-container"></div>
    </div>
    <script type="module" src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
