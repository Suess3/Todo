<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <style>
        #splash {
            position: fixed; inset: 0; background: #121212;
            display: flex; align-items: center; justify-content: center;
            z-index: 10000; pointer-events: none;
        }
        #splash-icon {
            width: 96px; height: 96px; border-radius: 20px;
            animation: splash-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        #splash-icon.exit {
            animation: splash-out 0.45s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }
        @keyframes splash-in {
            from { transform: rotate(540deg) scale(0); opacity: 0; }
            to   { transform: rotate(0deg)   scale(1); opacity: 1; }
        }
        @keyframes splash-out {
            from { transform: rotate(0deg)    scale(1); opacity: 1; }
            to   { transform: rotate(-360deg) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="splash"><img id="splash-icon" src="icon.svg"></div>
    <div id="auth-screen" class="hidden"></div>
    <div id="bg-pattern-overlay"></div>
    <div id="app" class="hidden">

        <div id="charts-modal" class="modal-overlay hidden">
            <div class="modal-card charts-card">
                <div class="modal-header">
                    <span data-i18n="productivity">Productivity</span>
                    <button id="charts-close" class="modal-close">✕</button>
                </div>
                <div id="charts-loading" class="charts-loading hidden" data-i18n="loading">Loading…</div>
                <div id="charts-content" class="charts-grid hidden">
                    <div class="chart-wrap"><canvas id="week-chart"></canvas></div>
                    <div class="chart-wrap"><canvas id="alltime-chart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <span data-i18n="settings">Settings</span>
                    <button id="settings-close" class="modal-close">✕</button>
                </div>
                <div class="setting-row">
                    <span data-i18n="light_mode">Light mode</span>
                    <label class="toggle">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <span data-i18n="language">Language</span>
                    <label class="toggle">
                        <input type="checkbox" id="lang-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <span data-i18n="urgency_intensity">Urgency coloring intensity</span>
                    <input type="range" id="urgency-slider" min="0" max="100" value="50" class="urgency-slider">
                </div>
                <div class="setting-row">
                    <span data-i18n="main_color">Main color</span>
                    <input type="range" id="accent-slider" min="0" max="360" value="217" class="accent-slider">
                </div>
                <div class="setting-row">
                    <span data-i18n="bg_shade">Background shade</span>
                    <input type="range" id="bg-slider" min="0" max="100" value="0" class="urgency-slider">
                </div>
                <div class="setting-row setting-col">
                    <span data-i18n="bg_pattern">Background pattern</span>
                    <div class="pattern-picker" id="pattern-picker">
                        <button class="pattern-btn active" data-pattern="none" data-i18n="pattern_none">None</button>
                        <button class="pattern-btn" data-pattern="grain" data-i18n="pattern_grain">Grain</button>
                        <button class="pattern-btn" data-pattern="dots" data-i18n="pattern_dots">Dots</button>
                        <button class="pattern-btn" data-pattern="grid" data-i18n="pattern_grid">Grid</button>
                        <button class="pattern-btn" data-pattern="diagonal" data-i18n="pattern_lines">Lines</button>
                        <button class="pattern-btn" data-pattern="scan" data-i18n="pattern_scan">Scan</button>
                    </div>
                </div>
                <div class="setting-row" id="pattern-opacity-row">
                    <span data-i18n="pattern_strength">Pattern strength</span>
                    <input type="range" id="pattern-slider" min="0" max="100" value="30" class="urgency-slider">
                </div>
                <div class="setting-row">
                    <span data-i18n="bg_photo">Background photo</span>
                    <div class="banner-btns">
                        <button id="banner-choose-btn" class="modal-action-btn" data-i18n="choose_photo">Choose photo</button>
                        <button id="banner-remove-btn" class="modal-action-btn muted" data-i18n="remove">Remove</button>
                    </div>
                </div>
                <input type="file" id="banner-file-input" accept="image/*" style="position:absolute;opacity:0;width:0;height:0;pointer-events:none">
                <div class="setting-row">
                    <button id="signout-btn" class="signout-btn danger" data-i18n="sign_out">Sign out</button>
                </div>
            </div>
        </div>

        <div id="app-banner">
            <div class="app-header">
                <span id="version-label" class="version-label"></span>
                <span id="save-status" class="save-status hidden"></span>
                <button id="undo-btn" class="settings-btn" title="Undo" disabled>↩</button>
                <button id="charts-btn" class="settings-btn" title="Productivity">◑</button>
                <button id="settings-btn" class="settings-btn">⚙︎</button>
            </div>
            <div id="page-tabs" class="page-tabs hidden">
                <button class="page-tab active" data-page="todo" data-i18n="tab_todo">Todo</button>
                <button class="page-tab" data-page="keepInMind" data-i18n="tab_notes">Notes</button>
                <button class="page-tab" data-page="soon" data-i18n="tab_soon">Soon</button>
                <button class="page-tab" data-page="longRun" data-i18n="tab_longrun">Long run</button>
            </div>
        </div>

        <div id="app-content" class="app-container"></div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    window.location.reload();
                    refreshing = true;
                }
            });
        }
    </script>
</body>
</html>
