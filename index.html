<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="auth-screen" class="hidden"></div>
    <div id="app" class="hidden">
        <div class="app-header">
            <button id="settings-btn" class="settings-btn">⚙︎</button>
            <button id="signout-btn" class="signout-btn">Sign out</button>
        </div>

        <div id="settings-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <span>Settings</span>
                    <button id="settings-close" class="modal-close">✕</button>
                </div>
                <div class="setting-row">
                    <span>Light mode</span>
                    <label class="toggle">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <span>Daily reminder</span>
                    <label class="toggle">
                        <input type="checkbox" id="reminder-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-row" id="reminder-time-row">
                    <span>Reminder time</span>
                    <input type="time" id="reminder-time" value="22:00" class="time-input">
                </div>
            </div>
        </div>
        <div id="page-tabs" class="page-tabs hidden">
            <button class="page-tab active" data-page="todo">Todo</button>
            <button class="page-tab" data-page="keepInMind">Keep in mind</button>
            <button class="page-tab" data-page="soon">Soon</button>
            <button class="page-tab" data-page="longRun">Long run</button>
        </div>
        <div id="app-content" class="app-container"></div>
    </div>
    <script type="module" src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
